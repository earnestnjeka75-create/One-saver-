<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One Saver - Easy Status Download</title>
<style>
body{font-family:Arial;text-align:center;padding:20px;background:#f0f0f0}
.box{background:white;padding:20px;border-radius:15px;max-width:400px;margin:auto;box-shadow:0 5px 15px rgba(0,0,0,0.1)}
.btn{display:block;width:100%;padding:16px;margin:12px 0;border:none;border-radius:10px;font-size:17px;font-weight:bold;cursor:pointer;text-decoration:none}
.green{background:#25D366;color:white}
.blue{background:#0084FF;color:white}
.dark{background:#333;color:white;font-size:14px}
video,img{width:100%;border-radius:10px;margin-top:15px;display:none}
.ad-box{background:#fffde7;border:1px dashed #f9a825;padding:10px;margin:15px 0;border-radius:8px;font-size:13px}
</style>
</head>
<body>
<div class="box">
<h2>One Saver ✅</h2>
<p><b>1.</b> View Status on WhatsApp<br><b>2.</b> Save it here in HD</p>

<!-- AD PLACE - EARN MONEY HERE -->
<div class="ad-box">
  <small>Advertisement</small><br>
  <!-- PASTE YOUR AD CODE HERE - From Monetag / Adsterra -->
  <p style="color:gray">Your Ad Will Show Here</p>
</div>

<button class="btn green" onclick="document.getElementById('file').click()">📁 SELECT STATUS</button>
<input type="file" id="file" accept="video/*,image/*" hidden>

<video id="previewVideo" controls></video>
<img id="previewImg">

<button class="btn blue" id="downBtn" style="display:none">⬇️ DOWNLOAD NOW</button>

<!-- WHATSAPP HELP BUTTON -->
<a class="btn dark" href="https://wa.me/254713834153?text=Hi%20One%20Saver%20help%20me">💬 Need Help? WhatsApp Me</a>

<p style="font-size:11px;color:gray">HD Quality • Fast • Free • Wajir Made</p>
</div>

<script>
const fileInput=document.getElementById('file');
const video=document.getElementById('previewVideo');
const img=document.getElementById('previewImg');
const downBtn=document.getElementById('downBtn');
let fileURL;
fileInput.addEventListener('change',function(){
  const file=this.files[0]; if(!file) return;
  fileURL=URL.createObjectURL(file);
  if(file.type.startsWith('video')){
    video.src=fileURL; video.style.display='block'; img.style.display='none';
  }else{
    img.src=fileURL; img.style.display='block'; video.style.display='none';
  }
  downBtn.style.display='block';
  downBtn.textContent='⬇️ DOWNLOAD '+file.name;
});
downBtn.addEventListener('click',function(){
  const a=document.createElement('a'); a.href=fileURL;
  a.download=fileInput.files[0].name; a.click();
});
</script>
</body>
</html>
